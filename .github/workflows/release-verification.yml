name: Release verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    name: Correct build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      BUG_AUTH_BYPASS: "0"
      BUG_WEEKEND_OFFER: "0"
      BUG_NO_LIMIT: "0"
      BUG_TOTAL_MISMATCH: "0"
      LAB_SCENARIO: baseline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.17.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium --no-shell
      - name: Check syntax
        run: npm run check
      - name: Verify the correct build
        run: npm test
      - name: Summarize results
        if: ${{ always() }}
        run: node scripts/ci-summary.js green
      - name: Upload green evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: green-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/results.json
            test-results/junit.xml
            test-results/artifacts/

  red:
    name: Detect the seeded defects
    needs: green
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      BUG_AUTH_BYPASS: "1"
      BUG_WEEKEND_OFFER: "1"
      BUG_NO_LIMIT: "1"
      BUG_TOTAL_MISMATCH: "1"
      LAB_SCENARIO: red
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.17.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium --no-shell
      - name: Verify all intended failures
        run: npm run test:red
      - name: Summarize results
        if: ${{ always() }}
        run: node scripts/ci-summary.js red
      - name: Upload red evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: red-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            defect-reports/red/
            test-results/defects/red/
            test-results/defects/red-summary.json
