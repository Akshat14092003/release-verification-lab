services:
  - type: web
    name: release-verification-lab
    runtime: docker
    plan: free
    repo: https://github.com/Akshat14092003/release-verification-lab
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: LAB_TEST_WORKERS
        value: "1"
